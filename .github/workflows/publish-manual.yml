name: Publicar imagen manual · ECR

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Rama, tag o SHA a construir'
        required: true
        default: master

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    uses: gpalaciosvx3/pt-ci-pipelines/.github/workflows/aws-ecr-publish.yml@v1
    with:
      ref: ${{ inputs.ref }}
