name: Publicar imagen · ECR

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'pull_request'
    uses: gpalaciosvx3/pt-ci-pipelines/.github/workflows/node-validate.yml@v1
    with:
      node-version: '22'

  publish:
    if: github.event_name == 'push'
    uses: gpalaciosvx3/pt-ci-pipelines/.github/workflows/aws-ecr-publish.yml@v1
